// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

// Use an explicitly selected in-repository output root; Android Studio's
// ordinary default remains available when JCE's builder was not invoked.
// Gradle 8.x DirectoryProperty is preferred over the deprecated buildDir setter.
def jceGradleRoot = System.getenv('JCE_ANDROID_GRADLE_BUILD_DIR')
if (jceGradleRoot) {
    allprojects { project ->
        project.layout.buildDirectory.set(new File(jceGradleRoot,
            project == rootProject ? 'root' : project.name))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
