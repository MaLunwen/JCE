plugins {
    id 'com.android.application'
}

android {
    ndkPath = System.getenv('ANDROID_NDK_HOME') ?: 'D:/Code/C_CPP/cross_platform/android-ndk-r27d'
    ndkVersion = '27.3.13750724'
    namespace = "com.jce"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.jce"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
    }
    lint {
        abortOnError = false
    }
}
