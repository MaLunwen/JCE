  - capability: ecs
    owner: flecs
    version: "4.1.5"
    facade: JceEntity + jce_scene_* (public); ecs_* private
    include_whitelist:
      - engine/src/middleware/scene/
      - engine/src/middleware/world/
      - engine/src/middleware/ai/
      - engine/src/middleware/net/
      - engine/src/middleware/audio/
      - engine/src/renderer/
      - engine/src/runtime/
      - engine/src/application/
    link_whitelist: [jce_scene, jce_world, jce_ai, jce_net, jce_audio, jce_renderer, jce_application]
    forbidden_alternatives: [second entity registry, ecs_* in public headers, flecs in editor/ or game projects]

  - capability: json
    owner: cjson
    version: "1.7.19"
    facade: jce_json_* (os/core/jce_json.h)
    # FILE-granular on purpose.  This used to list four DIRECTORIES, which let
    # any new file under engine/src/resource/ (etc.) reach for cJSON without
    # the gate noticing — the whitelist could not tell a sanctioned bridge TU
    # from a fresh bypass.  Every entry below is a TU that genuinely needs a
    # cJSON API the facade does not expose (Duplicate / SetValuestring /
    # PrintUnformatted / raw node surgery).  Adding a file here should be a
    # deliberate act with a reason, not a side effect of where it lives.
    #
    # If a TU only needs parse / get / is_* / array walk / object build /
    # print / free, it does NOT belong here — that is all facade-covered.
    # jce_world_partition.c and jce_mod_loader.c were removed this way
    # (jce_json_detach() closed the one real gap the former had).
    include_whitelist:
      - engine/src/os/core/jce_json.c                              # the facade itself
      - engine/src/middleware/scene/jce_scene_components_internal.h
      - engine/src/middleware/scene/jce_scene_tags_layers.c
      - engine/src/middleware/ai_dispatch/jce_aid_json.c
      - engine/src/resource/jce_bundle_contract_internal.c
      - engine/src/resource/jce_bundle_deps.c
      - engine/src/resource/jce_bundle_graph_internal.c
      - engine/src/resource/jce_bundle_loader.c
      - engine/src/resource/jce_bundle_pack.c
      - engine/src/resource/jce_bundle_pack_cook.c            # split out of the line above
    link_whitelist: [jce_core, jce_scene, jce_resource, jce_ai_dispatch]
    forbidden_alternatives: [handwritten JSON parser/writer, nlohmann/rapidjson, cJSON_* at consumer call sites]

