# JCE Dependency Ownership Matrix — machine-readable
#
# Consumed by tools/audit/check_dependency_boundaries.py (architecture audit).
# One entry per capability. `owner` = the third-party dep (or first-party
# module) that is the single authoritative implementation. `facade` = the JCE
# API family callers must use. `include_whitelist` = repo-relative directory
# prefixes whose TUs may include the dependency's headers directly.
# `link_whitelist` = CMake targets that may link the dependency directly.
# Everything else including/link­ing the dep directly is a boundary violation.
#
# Schema: see tools/audit/check_dependency_boundaries.py docstring.
# Sync rule: editing conanfile.py requirements REQUIRES updating this file
# and THIRD_PARTY_LICENSES.md in the same change.

schema_version: 1

capabilities:
  - capability: window-events-input
    owner: sdl
    version: "3.4.0"
    facade: jce_window_* / jce_input_* / jce_host_* (os/platform)
    include_whitelist:
      - engine/src/os/
      - engine/src/application/   # SDL_main callbacks + event pump glue
    link_whitelist: [jce_core, jce_platform, jce_cook]
    forbidden_alternatives: [raw Win32/Cocoa/X11 windowing, SDL Renderer]

  - capability: sdl-portability-substrate
    owner: sdl
    version: "3.4.0"
    facade: direct SDL utility headers are sanctioned engine-wide (SDL-as-portable-libc;
      see tools/lint/check_engine_native_io.py doctrine)
    include_whitelist:
      - engine/src/
      - engine/tools_include/
      - tools/
    link_whitelist: [jce_core, jce_platform, jce_renderer, jce_resource, jce_scene,
      jce_audio, jce_video, jce_ui, jce_save, jce_application, jce_ai_dispatch, jce_cook]
    notes: covers SDL_iostream/atomic/thread/mutex/timer/cpuinfo/filesystem/stdinc etc.
      The window/event/input/render subsystems stay confined to window-events-input.
      Umbrella <SDL3/SDL.h> outside os|application should be narrowed to the utility
      headers actually used (include-hygiene remediation P3).
      LINK LIST HISTORY - this used to read [jce_core, jce_platform, jce_cook], which
      described a fiction. jce_core linked sdl PUBLIC-ly, so 44 files across five more
      layers included <SDL3/...> while declaring nothing; the whitelist looked tight
      only because the free-riders were invisible to it. jce_core is PRIVATE now and
      every layer that uses SDL declares it, so this list is the real, enforced set.
      It is LONGER but no longer a lie - and any NEW layer reaching for SDL now has to
      appear here deliberately. Growth of this list is the signal to re-ask whether the
      layer should be using SDL at all.

  - capability: image-decode-ldr
    owner: sdl_image
    version: "3.4.0"
    facade: jce_image (single image service; callers never pick decoder)
    # NARROWED to the service itself.  os/platform used to appear here
    # because jce_window decoded the window icon with IMG_Load_IO — a
    # DECODER sitting in the one layer that cannot reach jce_image (L3),
    # so the icon path bypassed the service's protections, most concretely
    # the 16-bit-greyscale route-around that exists because that input
    # overruns libpng's heap.  Decoding moved above L3 (callers decode and
    # hand down pixels), so the platform layer holds no decoder at all.
    # engine/src/resource/ no longer includes it either.
    #
    # Keep this list at ONE directory.  A second entry means somebody has a
    # decode path that skips the service, which is the whole failure mode.
    include_whitelist:
      - engine/src/renderer/
    link_whitelist: [jce_platform, jce_renderer, jce_resource, jce_cook]
    forbidden_alternatives: [direct IMG_Load at call sites, second general-purpose loader]

  - capability: image-decode-hdr
    owner: stb_image (vendored 2.30)
    facade: jce_image (same service, HDR dispatch)
    include_whitelist:
      - engine/src/renderer/
      - engine/src/resource/    # jce_image_decode.c — the dispatch service impl
    forbidden_alternatives: [stb_image as general LDR loader]

  - capability: gpu-backend
    owner: bgfx
    version: "1.146.9306-550"
    facade: jce_render_* / jce_graphics_* (JCE handles only)
    include_whitelist:
      - engine/src/renderer/
      - engine/src/middleware/scene/    # scene renderer glue — audit exception, see ADR
      - engine/src/middleware/world/    # weather/TOD glue — audit exception
      - engine/src/middleware/ui/       # UI draw glue
      - engine/src/middleware/animation/ # GPU skinning upload
      - engine/src/resource/            # texture/mesh upload
      - engine/src/application/
      - tools/
    link_whitelist: [jce_renderer, jce_scene, jce_world, jce_ui, jce_animation, jce_resource, jce_application, jce_cook]
    forbidden_alternatives: [raw GL/Vulkan/D3D/Metal, SDL Renderer, bgfx types in public headers, bgfx in editor/ or game projects]

