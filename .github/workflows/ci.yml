name: ci

# EVERY BRANCH, not a named three.  The list used to be [main, master,
# develop]; the branch this project actually develops on is
# audit-p0-fixes-2026-08-31, so nothing ran at all -- a CI configuration that
# is present, syntactically valid and silent is the worst of the three states.
#
# `schedule` drives the second tier (see the TIERS note below).
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 04:00 UTC daily -- the heavy tier, off the interactive path.
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2
  # Hosted runners may install declared native dependencies; local CLI defaults to check.
  JCE_SYSTEM_PACKAGE_MODE: install
  JCE_SYSTEM_PACKAGE_SUDO: "1"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

# Cancel superseded runs on the same ref.
concurrency:
  # Scheduled audits and interactive pushes on main must not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'interactive' }}
  cancel-in-progress: true

# ── TIERS, and why ────────────────────────────────────────────────────────
#
# TIER 1 -- `lint` -- runs on EVERY push and PR.  It needs no compiler and no
# GPU: the lint suite, the public C ABI snapshot, both script generators, the
# audit suite's own unit tests and the architecture audit.  Minutes, not tens
# of minutes.  It is also the tier that catches the things a build cannot see
# -- an ABI break, a layering violation, a copyleft dependency, a README whose
# numbers stopped being true.
#
# Native desktop gates run for code changes on push/PR and always on
# schedule/dispatch. Documentation-only changes retain the lint gate.
jobs:
  changes:
    name: classify native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: paths
        name: Detect code changes conservatively
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          name = os.environ["GITHUB_EVENT_NAME"]
          base = event.get("pull_request", {}).get("base", {}).get("sha") if name == "pull_request" else event.get("before")
          native = True
          if name in ("push", "pull_request") and base and set(base) != {"0"}:
              diff = subprocess.run(["git", "diff", "--name-only", "-z", base, "HEAD"], capture_output=True)
              if diff.returncode == 0:
                  paths = diff.stdout.decode("utf-8", errors="replace").split("\0")
                  native = any(path and not (path.endswith(".md") or path.startswith(("docs/", ".docs/"))) for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("native=" + str(native).lower() + "\n")

  # ---------------------------------------------------------------------------
  # Fast lint gate. Runs on every PR before any expensive build.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (structural + style)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The lint suite executes Conan-backed unit tests and YAML ownership
      # parsing; install those test prerequisites before the suite.
      - name: Fast first-party file-size budget
        run: python tools/lint/check_file_size.py
      - name: Fast engine-layer dependencies
        run: python tools/lint/check_layer_dependencies.py
      - name: Verify desktop CMake/Conan layout consistency
        run: python tools/build/layout_contract.py --check
      - name: Verify layout negative and migration controls
        run: python -m unittest discover -s tools/tests -p test_build_layout_contract_v10.py -v
      - name: Check complete build-directory ownership and platform parity
        run: python tools/build/full_layout_contract.py --check
      - name: Verify full-layout negative controls
        run: python -m unittest discover -s tools/tests -p test_full_layout_contract_v11.py -v
      - name: Verify Conan Lua source-cache helper guards
        run: python -m unittest discover -s tools/tests -p test_ci_seed_lua_source.py -v
      - name: Install lint test prerequisites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install "conan>=2.0,<3" "PyYAML>=6,<7"
          conan profile detect --force
      - name: Run all lints
        id: full_lint
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python tools/lint/run_all.py

      # The public C ABI gate, as its own named step.
      #
      # run_architecture_audit.py also runs it (its CHECKS list, gating), but
      # only after `pip install conan` and `conan profile detect` -- so an ABI
      # break could not be seen until an unrelated toolchain step succeeded,
      # and when it was seen it was reported inside a step named "deps, ABI
      # boundaries, licences" whose most common failure is a Conan hiccup.
      # This needs no toolchain and says what it is.
      # --committed, NOT the bare invocation this step used to run.  The bare
      # mode answers about the WORKING TREE and fails only on a break; on a
      # clean CI checkout that sounds equivalent and is not.  Measured: a
      # parser mutation that shreds every public struct body leaves the bare
      # mode printing OK and exiting 0, because the damage scores as MOVED --
      # emitting lines like `MOVED struct X - declared in h -> h`, a header
      # moved to itself, which the bare mode treats as a pass.  --committed
      # catches it (exit 1, "51 disagreements") and additionally checks
      # PROVENANCE: that the declarations recorded are the committed ones, not
      # a contributor's uncommitted headers.  tools/lint/run_all.py:67 has
      # always passed --committed; CI did not, so the two tiers disagreed
      # about what "the ABI gate is green" means.
      #
      # This is expected to be RED on arrival, and that is the point of the
      # change rather than an accident of it: three declarations currently
      # drift, all from JceSceneRenderingSettings gaining wind_direction_x,
      # wind_direction_z and temperature_c INSERTED at index 40 -- which moves
      # cloud_density from 40 to 43 and every field after it.  An
      # already-compiled consumer reading cloud_density now reads
      # wind_direction_x.  The fix is `--update --committed` by whoever knows
      # that insertion was intended; a warning cannot un-ship an ABI break
      # that has already reached an SDK consumer, a Lua binding or the JNI
      # bridge.
      - name: Public C ABI snapshot (removals / signature changes)
        run: python tools/audit/check_abi_snapshot.py --committed

      # The scripting surface's manifest gate, in the same fast tier and for
      # the same reason: it needs no toolchain.  It reads jce_script.h and
      # jce_script.c and fails naming the member when the host grows without
      # an exposure decision.
      - name: Scripting manifest (totality / registration parity)
        run: python tools/scriptgen/gen_script_bindings.py

      # The C ABI backend of the same manifest, in the same toolchain-free
      # tier.  What it guards is the shared library's EXPORT SET, which is the
      # scripting sandbox boundary: the .def, the version script and the
      # expected-export table are all emitted from script-api.json, and a
      # hand-edit to any of them is what this catches before a build does.
      - name: Scripting C ABI (generated export set)
        run: python tools/scriptgen/gen_script_c_abi.py

      # The gate's own unit tests.  check_abi_snapshot.py was blind to every
      # record containing a nested anonymous member for as long as it existed;
      # a gate fix that is itself unguarded is not a fix.
      - name: Audit tooling unit tests
        id: audit_units
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -m unittest discover -s tools/audit/tests -p "test_*.py" -v

      # The audit suite's licence gate resolves the Conan graph to prove no
      # copyleft entered the HOST dependency closure. Without Conan on PATH
      # that gate SKIPS (by design — a contributor offline must still be able
      # to run the suite), so CI must install it or the gate is decorative.
      # Only recipe metadata is needed, so this resolves in seconds and never
      # builds a package.
      - name: Architecture audit (deps, ABI boundaries, licences)
        id: arch_audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python tools/audit/run_architecture_audit.py

  # ---------------------------------------------------------------------------
  # Desktop build matrix. Runs independently of lint; native errors remain fatal.
  #
  # Real SDK builds use the canonical driver on every desktop runner.
  # Package caches are reusable; native build trees are not copied between jobs.
  # ---------------------------------------------------------------------------
      - name: Report advisory lint failures without blocking native jobs
        if: ${{ always() && (steps.full_lint.outcome == 'failure' || steps.audit_units.outcome == 'failure' || steps.arch_audit.outcome == 'failure') }}
        shell: bash
        run: |
          echo '::warning title=JCE advisory lint::Full lint or audit found issues; see failing step and job summary. Native builds and required fast gates retain their real exit codes.'
          echo '## Advisory lint findings (not a clean pass)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full lint: ${{ steps.full_lint.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit tests: ${{ steps.audit_units.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Architecture audit: ${{ steps.arch_audit.outcome }}' >> "$GITHUB_STEP_SUMMARY"
  build:
    name: build ${{ matrix.os }}
    if: needs.changes.outputs.native == 'true'
    needs: [changes]
    runs-on: ${{ matrix.os }}
    # Cold Conan + Debug JCE compilation exceeded the old 60-minute Windows limit.
    # Preserve real compiler/test failures; do not use continue-on-error.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse Conan package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/**') }}
          restore-keys: conan-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Conan
        run: |
          pip install --upgrade pip
          pip install "conan>=2.0" ninja
          conan profile detect --force

      - name: Seed verified Conan Lua 5.4.8 source cache
        run: python tools/build/ci_seed_lua_source.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the public SDK
        run: python scripts/jce.py sdk --variant release --no-debug --profiling off

  # ---------------------------------------------------------------------------
  # SDK consumer closure — the stub-PAK regression guard.
  # The independent installed-SDK smoke consumer validates cooked embedded
  # assets independently of user game sources. User projects own their
  # consumer checks; the generic engine workflow has no project-specific paths.
  # Gated to main/dispatch until the toolchain is proven green on CI runners;
  # promote to a PR gate (drop the `if`) once stable.
  # See scripts/jce.py and contracts/source-layout.json
  # ---------------------------------------------------------------------------
  sdk-consumer:
    name: sdk-consumer (installed SDK + embedded assets)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse Conan package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/**') }}
          restore-keys: conan-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Conan + Ninja
        run: |
          pip install --upgrade pip
          pip install "conan>=2.0" ninja
          conan profile detect --force
      - name: Seed verified Conan Lua 5.4.8 source cache
        run: python tools/build/ci_seed_lua_source.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build SDK and validate independent consumer + cooked assets
        run: python scripts/jce.py sdk --arch x64 --variant release --no-debug --smoke
  # ---------------------------------------------------------------------------
  # Unit tests (Unity + CTest). Phase 1 hardening; covers L1-L2 first,
  # expands to L3+ as suites land under tests/.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: unit-tests ${{ matrix.os }}
    if: needs.changes.outputs.native == 'true'
    needs: [changes]
    runs-on: ${{ matrix.os }}
    # Cold Conan + Debug JCE compilation exceeded the old 60-minute Windows limit.
    # Preserve real compiler/test failures; do not use continue-on-error.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-2022
            arch: x64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Supply the hosted runner's compiler environment. The shared driver
      # also discovers the selected installation for Conan dependency builds.
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Reuse Conan package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/**') }}
          restore-keys: conan-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Conan + Ninja
        run: |
          pip install --upgrade pip
          pip install "conan>=2.0" ninja Pillow numpy
          conan profile detect --force

      - name: Seed verified Conan Lua 5.4.8 source cache
        run: python tools/build/ci_seed_lua_source.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build managed scripting artifacts
        run: |
          python scripting/csharp/build_csharp.py
          python scripting/java/build_java.py
      - name: Build and run Debug tests through the shared driver
        run: python scripts/jce.py test --configure --variant debug --arch ${{ matrix.arch }} --jobs 2
      - name: POSIX C99 declarations and negative control
        if: runner.os == 'Linux'
        run: python tests/os/platform/check_tcp_c99.py
